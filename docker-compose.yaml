version: '3.8'

services:
  db:
    image: postgres:15-alpine
    restart: always
    env_file:
      - ./backend/.env
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    restart: always
    # Порты можно вообще убрать, так как общаемся через Nginx внутри сети.
    # Но для локальной отладки можно оставить, или закомментировать.
    # ports:
    #   - "5001:5001" 
    env_file:
      - ./backend/.env
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"
      - "443:443"  # <-- Добавили HTTPS порт
    volumes:
      # 1. Прокидываем конфиг Nginx (замени путь если отличается)
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf
      # 2. Прокидываем сертификаты (Read-only :ro)
      - /etc/letsencrypt:/etc/letsencrypt:ro
    env_file:
      - ./frontend/.env
    depends_on:
      - backend

volumes:
  postgres_data: