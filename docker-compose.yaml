version: '3.8'

services:
  # --- База данных ---
  db:
    image: postgres:15-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Бэкенд ---
  backend:
    build: ./backend
    restart: always
    ports:
      - "5001:5001" # Можно убрать, если хочешь доступ ТОЛЬКО через nginx
    environment:
      # Важно: host базы данных теперь не localhost, а имя сервиса "db"
      DATABASE_URL: postgresql://${DB_USER}:${DB_PASSWORD}@db:5432/${DB_NAME}?schema=public
      PORT: 5001
      JWT_SECRET: ${JWT_SECRET}
      # Внутри Docker сети фронт доступен по имени сервиса, но для CORS 
      # лучше указывать реальный домен, если будешь деплоить
      FRONTEND_URL: http://localhost 
    depends_on:
      db:
        condition: service_healthy

  # --- Фронтенд (Nginx) ---
  frontend:
    build: ./frontend
    restart: always
    ports:
      - "80:80"   # HTTP порт
      # - "443:443" # В будущем для HTTPS
    depends_on:
      - backend

volumes:
  postgres_data: